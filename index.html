<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Stage Cam Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; }
    
    #setupView {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; padding: 20px; text-align: center; gap: 14px;
    }
    .role-btn {
      width: 100%; max-width: 320px; padding: 16px; border-radius: 12px; border: none;
      font-size: 16px; font-weight: bold; cursor: pointer; color: #fff;
    }
    .btn-cam { background: #2563eb; }
    .btn-dj { background: #059669; }
    input[type="text"] {
      padding: 14px; width: 100%; max-width: 320px; border-radius: 8px; border: 1px solid #333;
      background: #111; color: #fff; text-align: center; font-size: 16px;
    }

    #streamView { display: none; position: relative; width: 100vw; height: 100vh; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    canvas { display: none; } /* Canvas invizibil folosit ca mixer pentru înregistrare continuă */

    /* Bara superioară de status și VU-Metru */
    .status-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; z-index: 20;
      font-size: 13px; font-weight: bold; text-shadow: 1px 1px 3px #000;
    }
    .top-left { display: flex; align-items: center; gap: 8px; }
    .rec-badge {
      display: none; background: #dc2626; padding: 4px 10px; border-radius: 20px;
    }
    
    /* Vu-metru compact */
    .vu-container {
      width: 60px; height: 10px; background: rgba(255,255,255,0.2);
      border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3);
    }
    .vu-fill {
      width: 0%; height: 100%;
      background: linear-gradient(to right, #22c55e 60%, #eab308 85%, #ef4444 100%);
      transition: width 0.05s ease-out;
    }

    /* Panou glisoare (Luminozitate & Volum Monitor) */
    .sliders-panel {
      position: absolute; top: 50px; right: 12px; z-index: 20;
      display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.6);
      padding: 10px 14px; border-radius: 12px; backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .slider-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .slider-row input[type="range"] { width: 90px; }

    /* Butoane inferioare */
    .overlay-controls {
      position: absolute; bottom: 25px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 20;
    }
